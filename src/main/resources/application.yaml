spring:
  application:
    name: Tenpo Test
  profiles:
    active: dev
server:
  port: 5001
  
resilience4j:
  ratelimiter:
    instances:
      global:
        limitForPeriod: 3
        limitRefreshPeriod: 60s       
        timeoutDuration: 0s
  retry:
    instances:
      percentService:        # Máximo de intentos (incluyendo el primero)
        maxAttempts: 3
        waitDuration: 2s